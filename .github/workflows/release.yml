name: Release

# Publish a GitHub Release with the Windows zip: push a tag like v0.1.0, or run this workflow by hand
# (Actions > Release > Run workflow) with a version; then the release creates the tag on this commit.
# Signing: the "release" environment holds the signing settings once they exist (host/windows/sign.ps1);
# until then the build is unsigned and the step says so.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0 (tagged v0.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, sign (when configured) and zip
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          SIGNING_DLIB: ${{ vars.SIGNING_DLIB }}
        run: host/windows/build.ps1 -Version ($env:TAG.TrimStart('v'))
      - name: Smoke test on the Windows desktop
        shell: pwsh
        run: host/windows/smoke.ps1 -Scr dist-windows/CosmicShore.scr
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist-windows/*.zip | Select-Object -First 1
          $notes = @"
          Cosmic Shore Screensaver for Windows 10 and 11.

          Download **$($zip.Name)**, extract it, copy **CosmicShore.scr** into `C:\Windows\System32` (Windows asks for admin permission), then pick **Cosmic Shore** in Screen Saver Settings.
          This build is not code-signed yet: Windows shows "Windows protected your PC". Click **More info**, then **Run anyway**.
          It runs offline and sends nothing anywhere. Full steps are in README.txt inside the zip.
          "@
          gh release create "$env:TAG" $zip.FullName dist-windows/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Cosmic Shore Screensaver $env:TAG" --notes $notes --prerelease
