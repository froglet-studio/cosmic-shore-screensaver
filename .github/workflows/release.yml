name: Release

# Publish a GitHub Release with the Windows zip: push a tag like v0.1.0, or run this workflow by hand
# (Actions > Release > Run workflow) with a version; then the release creates the tag on this commit.
#
# Signing (plan §8.1, M6): the .scr is signed with Azure Artifact Signing when the protected "release"
# environment has the variables below (docs/SIGNING.md has the setup). None of them is a secret: the
# workflow signs in to Azure with GitHub's OIDC token, so no password or key is stored anywhere.
#   AZURE_CLIENT_ID, AZURE_TENANT_ID   the app registration the workflow signs in as
#   SIGNING_ENDPOINT        e.g. https://eus.codesigning.azure.net/
#   SIGNING_ACCOUNT         the Artifact Signing account name
#   SIGNING_PROFILE         the certificate profile name
# While SIGNING_ACCOUNT is empty the release is unsigned and says so. Once it is set, a signing failure
# fails the release: it never quietly falls back to an unsigned file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0 (tagged v0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write   # the OIDC sign-in to Azure (only used when signing is configured)

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    env:
      SIGN: ${{ vars.SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build CosmicShore.scr
        shell: pwsh
        run: host/windows/build.ps1 -Version ($env:TAG.TrimStart('v')) -NoPackage
      - name: Signing is not configured
        if: env.SIGN != 'true'
        shell: pwsh
        run: Write-Host "::warning::unsigned build - the release environment has no SIGNING_ACCOUNT (docs/SIGNING.md)"
      - name: Sign in to Azure
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true   # it only needs the signer role on the signing account
      - name: Sign CosmicShore.scr (Azure Artifact Signing)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist-windows\CosmicShore.scr
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Cosmic Shore Screensaver
      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist-windows/CosmicShore.scr
          Write-Host "status: $($sig.Status)  signer: $($sig.SignerCertificate.Subject)  timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "CosmicShore.scr is not validly signed ($($sig.Status)): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "CosmicShore.scr has no timestamp, so the signature would expire in days" }
      - name: Zip
        shell: pwsh
        run: host/windows/package.ps1 -Version ($env:TAG.TrimStart('v'))
      - name: Smoke test on the Windows desktop
        shell: pwsh
        run: host/windows/smoke.ps1 -Scr dist-windows/CosmicShore.scr
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist-windows/*.zip | Select-Object -First 1
          $signing = if ($env:SIGN -eq 'true') {
            "This build is code-signed by Froglet Games, Inc. Windows may still show ""Windows protected your PC"" for a new release until enough people have downloaded it: click **More info**, check the publisher says Froglet Games, Inc., then **Run anyway**."
          } else {
            "This build is not code-signed yet: Windows shows ""Windows protected your PC"". Click **More info**, then **Run anyway**."
          }
          $notes = @"
          Cosmic Shore Screensaver for Windows 10 and 11.

          Download **$($zip.Name)**, extract it, right-click **CosmicShore.scr** and choose **Install**.
          $signing
          It runs offline and sends nothing anywhere. Full steps are in README.txt inside the zip.
          "@
          gh release create "$env:TAG" $zip.FullName dist-windows/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Cosmic Shore Screensaver $env:TAG" --notes $notes --prerelease
